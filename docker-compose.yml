services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/route53.db
      CORS_ORIGINS: '["http://localhost:3000"]'
      SEED_DEMO_DATA: "true"
    volumes:
      - route53-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  route53-data: